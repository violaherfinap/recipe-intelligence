[project]
name = "recipe-intelligence"
version = "0.1.0"
description = "Evidence-grounded question answering over historical recipes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Kelompok Recipe Intelligence" }]
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "sentence-transformers>=3.0",
  "peft>=0.13",
  "accelerate>=0.33",
  "bm25s>=0.2",
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "fastapi>=0.112",
  "uvicorn>=0.30",
  "streamlit>=1.37",
  "pint>=0.24",
  "duckdb>=1.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_qa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
